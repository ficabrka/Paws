name: Android build

on:
  push:
    branches: [main]
    paths-ignore: ['web/**', '.github/workflows/pages.yml', '*.sql', 'README.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build APK
        working-directory: android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Paws-${{ github.run_number }}.apk
          cp android/app/build/outputs/apk/release/app-release.apk Paws.apk

      - name: Keep the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: Paws-${{ github.run_number }}
          path: Paws-${{ github.run_number }}.apk

      - name: Publish as a release (download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Paws test build ${{ github.run_number }}
          body: Test APK for Android. Download it on your phone and open it to install.
          make_latest: true
          files: |
            Paws-${{ github.run_number }}.apk
            Paws.apk
