plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.pawsvideo'
version = '1.0.0'

android {
  namespace "expo.modules.pawsvideo"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // same Media3 version as expo-video, so the modules match
  def media3 = "1.9.1"
  implementation "androidx.media3:media3-common:${media3}"
  implementation "androidx.media3:media3-effect:${media3}"
  implementation "androidx.media3:media3-transformer:${media3}"
}
